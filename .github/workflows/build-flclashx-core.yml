name: Build FlClashX Android ARM64 core

on:
  workflow_dispatch:
  push:
    branches: [subscription-flclashx-integration]
    paths:
      - '.github/workflows/build-flclashx-core.yml'
      - 'app/src/main/java/com/gilrtano/vpn/FlClashXEngine.kt'
      - 'app/src/main/java/com/gilrtano/vpn/MainActivity.kt'
      - 'app/src/main/java/com/gilrtano/vpn/FlClashXScanActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: flclashx-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout GilrTano
        uses: actions/checkout@v4

      - name: Checkout FlClashX v0.5.7
        uses: actions/checkout@v4
        with:
          repository: pluralplay/FlClashX
          ref: v0.5.7
          path: FlClashX

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install Flutter dependencies
        working-directory: FlClashX
        run: flutter pub get

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: FlClashX/core/go.sum

      - name: Download Mihomo core dependencies
        working-directory: FlClashX/core
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then exit 0; fi
            echo "Go dependency download failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 10))
          done
          echo "Unable to download Go dependencies after five attempts" >&2
          exit 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare FlClashX Android build
        working-directory: FlClashX/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew

      - name: Configure Maven Central mirror
        working-directory: FlClashX/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("settings.gradle.kts")
          source = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          source = source.replace("mavenCentral()", mirror + chr(10) + "        mavenCentral()", 1)
          settings.write_text(source)
          build = Path("build.gradle.kts")
          if build.exists():
              source = build.read_text()
              source = source.replace("mavenCentral()", mirror + chr(10) + "        mavenCentral()")
              build.write_text(source)
          PY

      - name: Build FlClashX gomobile core (ARM64 only)
        working-directory: FlClashX/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew :core:bindCore :core:assembleDebug \
              -Ptarget-platform=android-arm64 \
              -x :app:compileFlutterBuildDebug \
              -x :app:copyFlutterAssetsDebug \
              --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Gradle core build failed (attempt $attempt/4); retrying after Maven throttling."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Stage FlClashX core for GilrTano Android app
        run: |
          mkdir -p app/libs app/src/main/assets/licenses
          echo "Searching complete FlClashX checkout for generated AARs and gomobile outputs"
          find FlClashX -type f \( -name '*.aar' -o -name 'classes.jar' -o -name 'libgojni.so' -o -name 'libclash.so' \) -print | sort
          AAR="$(find FlClashX -type f -path '*/gomobile/core.aar' -print -quit)"
          if [ -z "$AAR" ]; then
            echo "FlClashX Gradle build produced no AAR. Build tree:"
            find FlClashX -type f | grep -E '(build|gomobile|\.aar$)' | sort | tail -150 || true
            exit 1
          fi
          echo "Using FlClashX AAR: $AAR"
          cp "$AAR" app/libs/flclashx-core.aar
          cp FlClashX/LICENSE app/src/main/assets/licenses/FLCLASHX-GPL-3.0.txt

      - name: Verify native core and Kotlin bridge
        working-directory: .
        run: |
          AAR="app/libs/flclashx-core.aar"
          test -s "$AAR"
          unzip -l "$AAR" | grep -E 'jni/arm64-v8a/libgojni.so'
          unzip -p "$AAR" classes.jar > /tmp/flclashx-classes.jar
          jar tf /tmp/flclashx-classes.jar | grep -E 'com/follow/clashx/core/mobile/Mobile.class'

      
      - name: Checkout pinned Usque v0.3.4
        uses: actions/checkout@v4
        with:
          repository: GeorgeXie2333/usque-app
          ref: v0.3.4
          path: usque-app

      - name: Setup Rust 1.97.1 for Android ARM64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Configure Android NDK for Usque
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          if [ ! -d "$NDK" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
            yes | "$SDKMANAGER" --licenses >/dev/null
            "$SDKMANAGER" --install "ndk;29.0.14206865"
          fi
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$TOOLCHAIN/lib" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build Usque v0.3.4 Android ARM64 native engine
        working-directory: usque-app
        run: |
          cargo build --locked --package usque-android --target aarch64-linux-android --release
          SO="target/aarch64-linux-android/release/libusque_android.so"
          test -s "$SO"
          readelf -h "$SO" | grep -E 'Machine:.*AArch64'
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$SO" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Stage complete Usque Android runtime v0.3.4
        run: |
          SRC=usque-app/apps/usque_gui/android/app/src/main/kotlin/io/github/georgexie2333/usque
          DST=app/src/main/java/io/github/georgexie2333/usque
          test -d "$SRC"
          mkdir -p "$DST"
          for f in "$SRC"/*.kt; do
            n=$(basename "$f")
            case "$n" in
              MainActivity.kt|AndroidEngineMethodHandler.kt|AndroidUiPluginRegistration.kt|AndroidRecentsVisibility.kt|AndroidShortcutController.kt|UsqueApplication.kt|TrackedPreferencesContext.kt|TrackedPreferencesMessenger.kt|TrackedPreferencesPlugin.kt|VpnControlClient.kt|VpnPermissionRequestQueue.kt|OnboardingPermissionCoordinator.kt|ProtonVerificationWindow.kt|TvInputHost.kt) continue ;;
            esac
            cp "$f" "$DST/$n"
          done
          cp "$SRC/NativeEngine.kt" "$DST/NativeEngine.kt"
          mkdir -p app/src/main/res/values
          test -s app/src/main/res/values/usque_strings.xml
          for d in usque-app/apps/usque_gui/android/app/src/main/res/drawable-*; do
            [ -d "$d" ] || continue
            mkdir -p "app/src/main/res/$(basename "$d")"
            cp "$d"/* app/src/main/res/$(basename "$d")/ 2>/dev/null || true
          done
          sed -i 's/R.drawable.ic_stat_usque/R.drawable.gilrtano_icon/g' "$DST/VpnNotificationController.kt"
          sed -i 's/R\.string\./com.gilrtano.vpn.R.string./g; s/R\.drawable\./com.gilrtano.vpn.R.drawable./g' "$DST"/*.kt
          test -s "$DST/UsqueVpnService.kt"
          test -s "$DST/SecureIdentityStore.kt"

      - name: Compile GilrTano ARM64 debug APK against FlClashX
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload GilrTano APK with FlClashX core
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-FlClashX-ARM64-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FlClashX ARM64 core
        uses: actions/upload-artifact@v4
        with:
          name: FlClashX-v0.5.7-Android-ARM64-Core
          path: app/libs/flclashx-core.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload GPL-3.0 license and source reference
        uses: actions/upload-artifact@v4
        with:
          name: FlClashX-v0.5.7-GPL-3.0
          path: |
            FlClashX/LICENSE
            FlClashX/README.md
          if-no-files-found: error
          retention-days: 14
