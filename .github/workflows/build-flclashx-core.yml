name: Build FlClashX Android ARM64 core

on:
  workflow_dispatch:
  push:
    branches: [subscription-flclashx-integration]
    paths:
      - '.github/workflows/build-flclashx-core.yml'
      - 'app/src/main/java/com/gilrtano/vpn/FlClashXEngine.kt'

permissions:
  contents: read

concurrency:
  group: flclashx-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout GilrTano
        uses: actions/checkout@v4

      - name: Checkout FlClashX v0.5.7
        uses: actions/checkout@v4
        with:
          repository: pluralplay/FlClashX
          ref: v0.5.7
          path: FlClashX

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install Flutter dependencies
        working-directory: FlClashX
        run: flutter pub get

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: FlClashX/core/go.sum

      - name: Download Mihomo core dependencies
        working-directory: FlClashX/core
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then exit 0; fi
            echo "Go dependency download failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 10))
          done
          echo "Unable to download Go dependencies after five attempts" >&2
          exit 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare FlClashX Android build
        working-directory: FlClashX/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew

      - name: Configure Maven Central mirror
        working-directory: FlClashX/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("settings.gradle.kts")
          source = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          source = source.replace("mavenCentral()", mirror + chr(10) + "        mavenCentral()", 1)
          settings.write_text(source)
          build = Path("build.gradle.kts")
          if build.exists():
              source = build.read_text()
              source = source.replace("mavenCentral()", mirror + chr(10) + "        mavenCentral()")
              build.write_text(source)
          PY

      - name: Build FlClashX gomobile core (ARM64 only)
        working-directory: FlClashX/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew :core:bindCore :core:assembleDebug \
              -Ptarget-platform=android-arm64 \
              -x :app:compileFlutterBuildDebug \
              -x :app:copyFlutterAssetsDebug \
              --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Gradle core build failed (attempt $attempt/4); retrying after Maven throttling."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Stage FlClashX core for GilrTano Android app
        run: |
          mkdir -p app/libs app/src/main/assets/licenses
          echo "Searching complete FlClashX checkout for generated AARs and gomobile outputs"
          find FlClashX -type f \( -name '*.aar' -o -name 'classes.jar' -o -name 'libgojni.so' -o -name 'libclash.so' \) -print | sort
          AAR="$(find FlClashX -type f -path '*/gomobile/core.aar' -print -quit)"
          if [ -z "$AAR" ]; then
            echo "FlClashX Gradle build produced no AAR. Build tree:"
            find FlClashX -type f | grep -E '(build|gomobile|\.aar$)' | sort | tail -150 || true
            exit 1
          fi
          echo "Using FlClashX AAR: $AAR"
          cp "$AAR" app/libs/flclashx-core.aar
          cp FlClashX/LICENSE app/src/main/assets/licenses/FLCLASHX-GPL-3.0.txt

      - name: Verify native core and Kotlin bridge
        working-directory: .
        run: |
          AAR="app/libs/flclashx-core.aar"
          test -s "$AAR"
          unzip -l "$AAR" | grep -E 'jni/arm64-v8a/libgojni.so'
          unzip -p "$AAR" classes.jar > /tmp/flclashx-classes.jar
          jar tf /tmp/flclashx-classes.jar | grep -E 'com/follow/clashx/core/mobile/Mobile.class'

      - name: Compile GilrTano ARM64 debug APK against FlClashX
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload GilrTano APK with FlClashX core
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-FlClashX-ARM64-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FlClashX ARM64 core
        uses: actions/upload-artifact@v4
        with:
          name: FlClashX-v0.5.7-Android-ARM64-Core
          path: app/libs/flclashx-core.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload GPL-3.0 license and source reference
        uses: actions/upload-artifact@v4
        with:
          name: FlClashX-v0.5.7-GPL-3.0
          path: |
            FlClashX/LICENSE
            FlClashX/README.md
          if-no-files-found: error
          retention-days: 14
