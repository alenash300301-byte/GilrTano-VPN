
name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o GilrTano-VPN-0.7.5-starter.zip

      - name: Fix JVM targets
        run: |
          python3 -c 'from pathlib import Path; p=Path("GilrTano-VPN-0.7.5/app/build.gradle.kts"); s=p.read_text(); s=s.replace("android {", "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }", 1); p.write_text(s)'

      - name: Build APK
        working-directory: GilrTano-VPN-0.7.5
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-debug
          path: GilrTano-VPN-0.7.5/app/build/outputs/apk/debug/app-debug.apk
