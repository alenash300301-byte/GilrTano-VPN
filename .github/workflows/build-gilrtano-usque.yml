name: Build GilrTano with Usque v0.3.4 native library

on:
  workflow_dispatch:
  push:
    branches: [subscription-flclashx-integration]
    paths:
      - '.github/workflows/build-gilrtano-usque.yml'
      - 'app/src/main/java/io/github/georgexie2333/usque/**'
      - 'app/src/main/res/values/usque_strings.xml'
      - 'app/src/main/java/com/gilrtano/vpn/UsqueIdentityStore.kt'
      - 'app/src/main/java/com/gilrtano/vpn/UsqueFreeEngine.kt'
      - 'app/src/main/java/com/gilrtano/vpn/MainActivity.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'

permissions:
  actions: read
  contents: read

concurrency:
  group: gilrtano-usque-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout GilrTano
        uses: actions/checkout@v4

      - name: Checkout pinned Usque v0.3.4
        uses: actions/checkout@v4
        with:
          repository: GeorgeXie2333/usque-app
          ref: v0.3.4
          path: usque-app

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure ARM64 Rust linker
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$TOOLCHAIN/lib" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build Usque JNI library
        working-directory: usque-app
        run: |
          cargo build --locked --package usque-android --target aarch64-linux-android --release
          test -s target/aarch64-linux-android/release/libusque_android.so
          readelf -h target/aarch64-linux-android/release/libusque_android.so | grep -E 'Machine:.*AArch64'
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/libusque_android.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Stage complete Usque Android runtime v0.3.4
        run: |
          SRC=usque-app/apps/usque_gui/android/app/src/main/kotlin/io/github/georgexie2333/usque
          DST=app/src/main/java/io/github/georgexie2333/usque
          mkdir -p "$DST"
          # Keep the complete native VPN service and its lifecycle/network dependencies.
          # Flutter-only UI entry points are intentionally not imported into GilrTano.
          for f in "$SRC"/*.kt; do
            n=$(basename "$f")
            case "$n" in
              MainActivity.kt|AndroidEngineMethodHandler.kt|AndroidUiPluginRegistration.kt|AndroidRecentsVisibility.kt|AndroidShortcutController.kt|UsqueApplication.kt|TrackedPreferencesContext.kt|TrackedPreferencesMessenger.kt|TrackedPreferencesPlugin.kt|VpnControlClient.kt|VpnPermissionRequestQueue.kt|OnboardingPermissionCoordinator.kt|ProtonVerificationWindow.kt|TvInputHost.kt|UsqueTileService.kt) continue ;;
            esac
            cp "$f" "$DST/$n"
          done
          cp "$SRC/NativeEngine.kt" "$DST/NativeEngine.kt"
          # Android resource IDs are aliased into GilrTano's existing namespace.
          mkdir -p app/src/main/res/values
          test -s app/src/main/res/values/usque_strings.xml
          for d in usque-app/apps/usque_gui/android/app/src/main/res/drawable-*; do
            [ -d "$d" ] || continue
            mkdir -p "app/src/main/res/$(basename "$d")"
            cp "$d"/* app/src/main/res/$(basename "$d")/ 2>/dev/null || true
          done
          # Use GilrTano's own notification icon; the upstream notification asset is not required.
          sed -i 's/R.drawable.ic_stat_usque/R.drawable.gilrtano_icon/g' "$DST/VpnNotificationController.kt"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore unchanged FlClashX AAR dependency
        uses: actions/download-artifact@v4
        with:
          name: FlClashX-v0.5.7-Android-ARM64-Core
          path: app/libs
          repository: alenash300301-byte/GilrTano-VPN
          run-id: 44466747953
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify restored FlClashX dependency
        run: test -s app/libs/flclashx-core.aar

      - name: Build GilrTano debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK contains Usque ARM64 library
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libusque_android.so'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-Usque-v0.3.4-ARM64-Integration-Candidate
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
