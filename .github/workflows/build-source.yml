name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/portal-gate-awg-integration', 'feature/portal-auto-dual-protocol']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/teapod-core/go.sum

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build native Xray AAR
        run: |
          sudo apt-get update
          sudo apt-get install -y patch unzip zip perl
          chmod +x scripts/build-native-aar.sh
          ./scripts/build-native-aar.sh
          test -s app/libs/teapod-core-1.7.7.aar

      - name: Decrypt and verify bundled PORTALGATE profiles
        env:
          PORTAL_ARCHIVE_KEY: ${{ secrets.PORTAL_ARCHIVE_KEY }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64, os, pathlib, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          source = pathlib.Path("app/src/main/assets/portal_gate.zip.aesgcm")
          target = pathlib.Path("app/src/main/assets/portal_gate.zip")
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit("Missing encrypted archive: app/src/main/assets/portal_gate.zip.aesgcm")
          key_text = os.environ.get("PORTAL_ARCHIVE_KEY", "").strip()
          if not key_text:
              raise SystemExit("Missing GitHub Actions secret PORTAL_ARCHIVE_KEY")
          try:
              key = base64.urlsafe_b64decode(key_text + "=" * (-len(key_text) % 4))
          except Exception as exc:
              raise SystemExit(f"PORTAL_ARCHIVE_KEY is not valid base64url: {exc}")
          if len(key) != 32:
              raise SystemExit(f"PORTAL_ARCHIVE_KEY must decode to 32 bytes; got {len(key)}")
          blob = source.read_bytes()
          if len(blob) < 34 or blob[:5] != b"GTPG1":
              raise SystemExit("Invalid PORTALGATE encrypted archive header")
          plaintext = AESGCM(key).decrypt(blob[5:17], blob[17:], b"GTPG1")
          target.write_bytes(plaintext)
          with zipfile.ZipFile(target) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              count = sum(1 for name in archive.namelist() if name.lower().endswith(".conf"))
          if count != 121:
              raise SystemExit(f"Expected 121 PORTALGATE .conf profiles, found {count}")
          print(f"Decrypted and verified {count} PORTALGATE profiles")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
