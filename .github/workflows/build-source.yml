name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/portal-gate-awg-integration', 'feature/portal-auto-dual-protocol']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/teapod-core/go.sum

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build native Xray AAR
        run: |
          sudo apt-get update
          sudo apt-get install -y patch unzip zip perl
          chmod +x scripts/build-native-aar.sh
          ./scripts/build-native-aar.sh
          test -s app/libs/teapod-core-1.7.7.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download and decrypt PORTAL profile archive
        env:
          PORTAL_ARCHIVE_URL: ${{ secrets.PORTAL_ARCHIVE_URL }}
          PORTAL_ARCHIVE_KEY: ${{ secrets.PORTAL_ARCHIVE_KEY }}
        run: |
          test -n "$PORTAL_ARCHIVE_URL" || {
            echo "Missing Actions secret PORTAL_ARCHIVE_URL (direct URL to encrypted .aesgcm archive)."
            exit 1
          }
          test -n "$PORTAL_ARCHIVE_KEY" || {
            echo "Missing Actions secret PORTAL_ARCHIVE_KEY (URL-safe base64 AES-256 key)."
            exit 1
          }
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 "$PORTAL_ARCHIVE_URL" -o /tmp/portal_gate.zip.aesgcm
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          raw = Path("/tmp/portal_gate.zip.aesgcm").read_bytes()
          if len(raw) < 33 or raw[:5] != b"GTPG1":
              raise SystemExit("Invalid encrypted PORTAL archive header")
          key = base64.urlsafe_b64decode(os.environ["PORTAL_ARCHIVE_KEY"] + "===")
          if len(key) != 32:
              raise SystemExit("PORTAL_ARCHIVE_KEY must decode to exactly 32 bytes")
          nonce, ciphertext = raw[5:17], raw[17:]
          plaintext = AESGCM(key).decrypt(nonce, ciphertext, b"GTPG1")
          Path("app/src/main/assets/portal_gate.zip").write_bytes(plaintext)
          PY
          unzip -t app/src/main/assets/portal_gate.zip
          test "$(unzip -Z1 app/src/main/assets/portal_gate.zip | grep -ci '\\.conf
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
)" -eq 121

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
