name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/usque-free-integration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/teapod-core/go.sum

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build native Xray AAR
        run: |
          sudo apt-get update
          sudo apt-get install -y patch unzip zip perl
          chmod +x scripts/build-native-aar.sh
          ./scripts/build-native-aar.sh
          test -s app/libs/teapod-core-1.7.7.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fetch pinned Usque Android native bridge
        shell: bash
        run: |
          set -euo pipefail
          USQUE_COMMIT=d41a0e771b4474924ed7e8933600c8d61616e273
          BASE="https://raw.githubusercontent.com/garthnet/usque-android-app/$USQUE_COMMIT"
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 "$BASE/app/libs/usque-classes.jar" -o app/libs/usque-classes.jar
          curl --fail --location --retry 3 "$BASE/app/libs/usque.aar" -o app/libs/usque.aar
          curl --fail --location --retry 3 "$BASE/app/src/main/jniLibs/arm64-v8a/libgojni.so" -o app/src/main/jniLibs/arm64-v8a/libgojni.so
          test "$(stat -c%s app/libs/usque-classes.jar)" = 13089
          test "$(stat -c%s app/libs/usque.aar)" = 7866306
          test "$(stat -c%s app/src/main/jniLibs/arm64-v8a/libgojni.so)" = 10821448
          test "$(git hash-object app/libs/usque-classes.jar)" = de0b9584e976e53815b2d8d08d499856f2fdeed4
          test "$(git hash-object app/libs/usque.aar)" = 74e068024329c8cd251b9deea2a3b0fa1076f7b2
          test "$(git hash-object app/src/main/jniLibs/arm64-v8a/libgojni.so)" = 6bac01f23b0355eca7ddf7a84c4ac063b60974f9

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
