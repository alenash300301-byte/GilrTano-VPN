name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/portal-gate-awg-integration', 'feature/portal-auto-dual-protocol', 'feature/quattro-import-social-checks', 'feature/aetris-multiprotocol-import']
  pull_request:
    branches: [main, 'feature/portal-auto-dual-protocol']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/teapod-core/go.sum

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build native Xray AAR
        run: |
          sudo apt-get update
          sudo apt-get install -y patch unzip zip perl
          chmod +x scripts/build-native-aar.sh
          ./scripts/build-native-aar.sh
          test -s app/libs/teapod-core-1.7.7.aar

      - name: Verify bundled PORTALGATE profiles
        run: |
          test -s app/src/main/assets/portal_gate.zip || {
            echo "Missing app/src/main/assets/portal_gate.zip. Upload the plain ZIP containing all 121 PORTALGATE .conf profiles."
            exit 1
          }
          unzip -t app/src/main/assets/portal_gate.zip
          count=$(unzip -Z1 app/src/main/assets/portal_gate.zip | grep -Ec '[.]conf$' || true)
          test "$count" -eq 121 || {
            echo "Expected 121 PORTALGATE .conf profiles, found $count"
            exit 1
          }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
