name: Build GilrTano VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/portal-gate-awg-integration', 'feature/portal-auto-dual-protocol']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: upstream/teapod-core/go.sum

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build native Xray AAR
        run: |
          sudo apt-get update
          sudo apt-get install -y patch unzip zip perl
          chmod +x scripts/build-native-aar.sh
          ./scripts/build-native-aar.sh
          test -s app/libs/teapod-core-1.7.7.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Inject private PORTAL profile archive
        if: ${{ secrets.PORTAL_ARCHIVE_BASE64 != '' }}
        env:
          PORTAL_ARCHIVE_BASE64: ${{ secrets.PORTAL_ARCHIVE_BASE64 }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$PORTAL_ARCHIVE_BASE64" | base64 --decode > app/src/main/assets/portal_gate.zip
          unzip -t app/src/main/assets/portal_gate.zip
          test "$(unzip -Z1 app/src/main/assets/portal_gate.zip | grep -ci '\\.conf

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
)" -ge 100

      - name: Require private PORTAL archive for full automatic chain
        env:
          PORTAL_ARCHIVE_BASE64: ${{ secrets.PORTAL_ARCHIVE_BASE64 }}
        run: |
          test -n "$PORTAL_ARCHIVE_BASE64" || {
            echo "Missing Actions secret PORTAL_ARCHIVE_BASE64; full 121-profile failover cannot be packaged."
            exit 1
          }

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
