name: Build libXray and GilrTano APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/portal-masque-libxray"

permissions:
  contents: read

jobs:
  build-portal-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout GilrTano VPN
        uses: actions/checkout@v4

      - name: Checkout pinned libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: v26.11.9
          path: .build/libXray

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Go modules
        working-directory: .build/libXray
        run: go mod download

      - name: Build Android libXray AAR
        working-directory: .build/libXray
        env:
          LIBXRAY_ANDROID_API: "29"
        run: |
          python3 build/main.py android
          test -s libXray.aar
          test -s libXray-sources.jar

      - name: Build legacy teapod-core AAR
        run: |
          # Materialize the local patched xray-core replacement before any Go command
          # resolves the module graph (go.mod replaces xray-core with ./.xray-core).
          bash upstream/teapod-core/build.sh prepare
          # Go 1.27 requires gomobile's gobind tool to be declared in the module.
          # Pin it to the x/mobile version already selected by teapod-core/go.mod.
          cd upstream/teapod-core
          go get -tool golang.org/x/mobile/cmd/gobind@v0.0.0-20260410095206-2cfb76559b7b
          cd ../..
          go install golang.org/x/mobile/cmd/gomobile@latest
          "${HOME}/go/bin/gomobile" init
          bash upstream/teapod-core/build.sh build
          test -s upstream/teapod-core/outputs/teapod-core-1.7.7.aar

      - name: Integrate AARs into Android app
        run: |
          mkdir -p app/libs
          cp .build/libXray/libXray.aar app/libs/libXray.aar
          cp upstream/teapod-core/outputs/teapod-core-1.7.7.aar app/libs/teapod-core-1.7.7.aar
          test -s app/libs/libXray.aar
          test -s app/libs/teapod-core-1.7.7.aar

          # Both gomobile AARs package the same shared Java runtime (go.Seq/go.Universe).
          # Keep that runtime from libXray and remove only the duplicate runtime
          # classes from teapod-core; preserve teapod-core's generated API classes.
          tmp="$(mktemp -d)"
          unzip -q app/libs/teapod-core-1.7.7.aar -d "$tmp"
          if [[ -f "$tmp/classes.jar" ]]; then
            zip -q -d "$tmp/classes.jar" 'go/*' || true
          fi
          # libXray is the single owner of gomobile's JNI runtime in the APK.
          # Remove the duplicate native runtime from teapod-core for every ABI.
          for so in "$tmp"/jni/*/libgojni.so; do
            [[ -e "$so" ]] && rm -f "$so"
          done
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/app/libs/teapod-core-1.7.7.aar" .)
          rm -rf "$tmp"

      - name: Build GilrTano debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-PORTAL-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload libXray AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-android-v26.11.9
          path: |
            .build/libXray/libXray.aar
            .build/libXray/libXray-sources.jar
          if-no-files-found: error
          retention-days: 14
