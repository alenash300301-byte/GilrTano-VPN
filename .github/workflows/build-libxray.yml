name: Build libXray and GilrTano APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/portal-masque-libxray"

permissions:
  contents: read

jobs:
  build-portal-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout GilrTano VPN
        uses: actions/checkout@v4

      - name: Checkout pinned libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: v26.11.9
          path: .build/libXray

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Go modules
        working-directory: .build/libXray
        run: go mod download

      - name: Build Android libXray AAR
        working-directory: .build/libXray
        env:
          LIBXRAY_ANDROID_API: "29"
        run: |
          python3 build/main.py android
          test -s libXray.aar
          test -s libXray-sources.jar

      - name: Integrate AAR into Android app
        run: |
          mkdir -p app/libs
          cp .build/libXray/libXray.aar app/libs/libXray.aar
          test -s app/libs/libXray.aar

      - name: Build GilrTano debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-PORTAL-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload libXray AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-android-v26.11.9
          path: |
            .build/libXray/libXray.aar
            .build/libXray/libXray-sources.jar
          if-no-files-found: error
          retention-days: 14
