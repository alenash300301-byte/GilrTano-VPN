name: Build libXray Android AAR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-libxray.yml"

permissions:
  contents: read

jobs:
  build-libxray:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout GilrTano VPN
        uses: actions/checkout@v4

      - name: Checkout pinned libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: v26.11.9
          path: .build/libXray

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Download Go modules
        working-directory: .build/libXray
        run: go mod download

      - name: Build Android AAR
        working-directory: .build/libXray
        env:
          LIBXRAY_ANDROID_API: "29"
        run: |
          python3 build/main.py android
          test -s libXray.aar
          test -s libXray-sources.jar

      - name: Upload libXray AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-android-v26.11.9
          path: |
            .build/libXray/libXray.aar
            .build/libXray/libXray-sources.jar
          if-no-files-found: error
          retention-days: 14
