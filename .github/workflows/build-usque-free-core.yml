name: Build Usque FREE native engine (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [feature/free-usque-masque]
    paths:
      - '.github/workflows/build-usque-free-core.yml'

permissions:
  contents: read

concurrency:
  group: usque-free-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-usque:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout GilrTano
        uses: actions/checkout@v4

      - name: Checkout Usque v0.3.4
        uses: actions/checkout@v4
        with:
          repository: GeorgeXie2333/usque-app
          ref: v0.3.4
          path: Usque

      - name: Checkout FlClashX v0.5.7
        uses: actions/checkout@v4
        with:
          repository: pluralplay/FlClashX
          ref: v0.5.7
          path: FlClashX

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools and NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure Android ARM64 toolchain
        working-directory: Usque
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$TOOLCHAIN/lib" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Build Usque JNI library
        working-directory: Usque
        run: cargo build --locked --package usque-android --target aarch64-linux-android --release

      - name: Verify JNI library
        working-directory: Usque
        run: |
          LIB="target/aarch64-linux-android/release/libusque_android.so"
          test -s "$LIB"
          file "$LIB"
          llvm-readelf -h "$LIB" | grep -E 'Class:.*ELF64|Machine:.*AArch64'

      # The app's Subscription engine is a real compile-time dependency.
      # Build the exact FlClashX AAR instead of silently removing that engine.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install Flutter dependencies
        working-directory: FlClashX
        run: flutter pub get

      - name: Setup Go for FlClashX core
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: FlClashX/core/go.sum

      - name: Download FlClashX core dependencies
        working-directory: FlClashX/core
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download; then exit 0; fi
            echo "Go dependency download failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 10))
          done
          echo "Unable to download Go dependencies after five attempts" >&2
          exit 1

      - name: Setup Android NDK for FlClashX
        uses: nttld/setup-ndk@v1
        id: flclash-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Prepare FlClashX Android build
        working-directory: FlClashX/android
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew

      - name: Build FlClashX gomobile core (ARM64)
        working-directory: FlClashX/android
        env:
          ANDROID_NDK_HOME: ${{ steps.flclash-ndk.outputs.ndk-path }}
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew :core:bindCore :core:assembleDebug -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "FlClashX core build failed (attempt $attempt/4); retrying."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Stage and verify FlClashX AAR
        run: |
          mkdir -p app/libs app/src/main/assets/licenses
          AAR="$(find FlClashX -type f -path '*/gomobile/core.aar' -print -quit)"
          if [ -z "$AAR" ]; then
            echo "FlClashX build produced no gomobile/core.aar"
            find FlClashX -type f | grep -E '(build|gomobile|\\.aar$)' | sort | tail -150 || true
            exit 1
          fi
          cp "$AAR" app/libs/flclashx-core.aar
          cp FlClashX/LICENSE app/src/main/assets/licenses/FLCLASHX-GPL-3.0.txt
          unzip -l app/libs/flclashx-core.aar | grep -E 'jni/arm64-v8a/libgojni.so'
          unzip -p app/libs/flclashx-core.aar classes.jar > /tmp/flclashx-classes.jar
          jar tf /tmp/flclashx-classes.jar | grep -E 'com/follow/clashx/core/mobile/Mobile.class'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Package Usque into GilrTano APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp Usque/target/aarch64-linux-android/release/libusque_android.so app/src/main/jniLibs/arm64-v8a/
          gradle --no-daemon :app:assembleDebug

      - name: Upload GilrTano FREE integration APK
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-FREE-Usque-Integration-ARM64-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Usque native engine
        uses: actions/upload-artifact@v4
        with:
          name: GilrTano-FREE-Usque-v0.3.4-ARM64
          path: Usque/target/aarch64-linux-android/release/libusque_android.so
          if-no-files-found: error
          retention-days: 14
