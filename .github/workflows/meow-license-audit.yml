name: Meow dependency license gate

on:
  workflow_dispatch:
  push:
    branches: [portal-quattro-manual-meow]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-license-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout pinned Meow Android sources
        uses: actions/checkout@v4
        with:
          repository: meow-rs/meow-android
          ref: ad3b6e32292215a62feed27ab74157251b1575fb
          path: meow-android
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.18.3 --locked
      - name: Apply upstream repository license to local FFI crate metadata
        working-directory: meow-android/core/src/main/rust/meow-android-ffi
        run: sed -i '/^version = "0.1.0"$/a license = "MIT"' Cargo.toml
      - name: Audit pinned Meow Android dependency graph
        working-directory: meow-android/core/src/main/rust/meow-android-ffi
        run: cargo deny check licenses sources
      - name: Audit upstream Meow workspace dependency graph
        run: |
          git clone --depth 1 --branch v0.29.0 https://github.com/meow-rs/meow-rs.git meow-upstream
          cd meow-upstream
          # Every workspace crate is covered by the repository's MIT LICENSE;
          # several internal, unpublished tools omit license.workspace metadata.
          while IFS= read -r manifest; do
            if grep -q '^version.workspace = true' "$manifest" && ! grep -q '^license' "$manifest"; then
              sed -i '/^edition.workspace = true$/a license.workspace = true' "$manifest"
            fi
          done < <(find crates -name Cargo.toml -type f)
          cargo deny check licenses sources
